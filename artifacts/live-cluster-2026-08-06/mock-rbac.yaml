apiVersion: v1
kind: Namespace
metadata:
  name: kubiscan-risk-lab
  labels:
    app.kubernetes.io/part-of: kubiscan-live-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: kubiscan-risk-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-reader
  namespace: kubiscan-risk-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-auditor
  namespace: kubiscan-risk-lab
---
# Deliberately dangerous: any authenticated principal can modify
# cluster-wide bindings and grant additional privileges.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubiscan-mock-public-rbac-editor
  labels:
    app.kubernetes.io/part-of: kubiscan-live-test
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubiscan-mock-public-rbac-editor
  labels:
    app.kubernetes.io/part-of: kubiscan-live-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubiscan-mock-public-rbac-editor
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:authenticated
---
# Deliberately dangerous: full Kubernetes API access for one ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubiscan-mock-wildcard-admin
  labels:
    app.kubernetes.io/part-of: kubiscan-live-test
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubiscan-mock-wildcard-admin
  labels:
    app.kubernetes.io/part-of: kubiscan-live-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubiscan-mock-wildcard-admin
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: kubiscan-risk-lab
---
# A real namespaced credential-exposure scenario.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubiscan-mock-secret-reader
  namespace: kubiscan-risk-lab
  labels:
    app.kubernetes.io/part-of: kubiscan-live-test
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubiscan-mock-secret-reader
  namespace: kubiscan-risk-lab
  labels:
    app.kubernetes.io/part-of: kubiscan-live-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubiscan-mock-secret-reader
subjects:
  - kind: ServiceAccount
    name: secret-reader
    namespace: kubiscan-risk-lab
---
# A mock external user can execute commands inside namespace Pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubiscan-mock-pod-exec
  namespace: kubiscan-risk-lab
  labels:
    app.kubernetes.io/part-of: kubiscan-live-test
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubiscan-mock-pod-exec
  namespace: kubiscan-risk-lab
  labels:
    app.kubernetes.io/part-of: kubiscan-live-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubiscan-mock-pod-exec
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: mock-developer@example.test
---
# Deliberately left without a binding to verify LATENT prioritisation.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubiscan-mock-latent-pod-creator
  namespace: kubiscan-risk-lab
  labels:
    app.kubernetes.io/part-of: kubiscan-live-test
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create"]
---
# Impersonation is cluster-scoped and gives the auditor another active risk.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubiscan-mock-user-impersonator
  labels:
    app.kubernetes.io/part-of: kubiscan-live-test
rules:
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubiscan-mock-user-impersonator
  labels:
    app.kubernetes.io/part-of: kubiscan-live-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubiscan-mock-user-impersonator
subjects:
  - kind: ServiceAccount
    name: security-auditor
    namespace: kubiscan-risk-lab
