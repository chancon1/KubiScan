apiVersion: v1
kind: Namespace
metadata:
  name: kubiscan
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubiscan-live-test
  namespace: kubiscan
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubiscan-live-test
rules:
  - apiGroups: ["*"]
    resources:
      - roles
      - clusterroles
      - rolebindings
      - clusterrolebindings
      - pods
      - secrets
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubiscan-live-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubiscan-live-test
subjects:
  - kind: ServiceAccount
    name: kubiscan-live-test
    namespace: kubiscan
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kubiscan-live-test-20260806
  namespace: kubiscan
  labels:
    app.kubernetes.io/part-of: kubiscan-live-test
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubiscan-live-test
      annotations:
        splunk.com/index: kubiscan
        splunk.com/sourcetype: kube:container:kubiscan
    spec:
      serviceAccountName: kubiscan-live-test
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 3456
        runAsGroup: 3456
      containers:
        - name: kubiscan
          image: kubiscan:rbac-risk-events-live
          imagePullPolicy: Never
          env:
            - name: KUBISCAN_REPORT_MODE
              value: events
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 3456
            runAsGroup: 3456
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
