apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: kubiscan-risk-lab
  labels:
    app.kubernetes.io/name: nginx-demo
    app.kubernetes.io/part-of: kubiscan-live-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.28.0-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-demo
  namespace: kubiscan-risk-lab
  labels:
    app.kubernetes.io/part-of: kubiscan-live-test
spec:
  selector:
    app.kubernetes.io/name: nginx-demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-demo
  namespace: kubiscan-risk-lab
  labels:
    app.kubernetes.io/part-of: kubiscan-live-test
spec:
  ingressClassName: nginx
  rules:
    - host: nginx.kubiscan.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-demo
                port:
                  number: 80
