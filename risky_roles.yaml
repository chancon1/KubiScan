# Risk: the /debug endpoints expose pprof, whose heap dumps can contain tokens
#       and secret material the API server held in memory
# Reference: https://kubernetes.io/docs/concepts/security/api-server-bypass-risks/
#
# nonResourceURLs is a field of its own in RBAC, not a resource name, and only a
# ClusterRole can grant it. Only the sensitive paths are listed: every
# authenticated user legitimately holds /healthz, /version and /api through
# system:discovery, so matching all non-resource URLs would be pure noise.
- metadata:
    name: risky-nonresourceurls-debug
    priority: MEDIUM
    scope: cluster
    profile: cluster-scoped
    category: data-access
  rules:
  - nonResourceURLs: ["/debug/*"]
    verbs: ["get", "post", "*"]

