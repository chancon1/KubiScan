######################### REGION - Risky permissions combinations #########################
#
# HOW A PRIORITY IS DECIDED
#
# 'priority' below is a BASE score: what the permission is worth in the plain
# case of a namespaced Role, bound, in an unremarkable namespace. The scanner
# then applies the context rules named in 'profile'/'modifiers' and clamps the
# result to LOW..CRITICAL. A match never decays to nothing - context can make a
# finding less urgent, but the permission is still there.
#
# This is why "create pods" is not flat CRITICAL any more. In one team namespace
# it is HIGH; granted cluster-wide, or next to a service account that is already
# critical, it becomes CRITICAL; on a role nobody is bound to, it is MEDIUM.
#
# PATTERN FIELDS
#
#   name        identifier shown in the report
#   priority    base score - CRITICAL / HIGH / MEDIUM / LOW
#   scope       'namespaced' (default) or 'cluster'. A cluster-scoped resource is
#               never granted by a namespaced Role, so patterns marked 'cluster'
#               are not even evaluated against one. This removes a whole class of
#               false positives: a Role granting "get nodes/proxy" grants nothing.
#   appliesTo   [Role, ClusterRole] unless narrowed. Usually left implicit -
#               'scope' already excludes Roles where that would be wrong.
#   profile     named set of context modifiers, see below
#   modifiers   inline overrides merged on top of the profile
#   category    grouping for reports and filtering
#   summary     optional short verb phrase for risk events
#   description optional explanation of why the permission is risky
#   impact      optional consequence shown after the description
#
# MODIFIERS
#
#   clusterWide             ClusterRole reached by a ClusterRoleBinding: the
#                           grant covers every namespace.
#   namespacedBindingOnly   ClusterRole that only RoleBindings reference. Binding
#                           a ClusterRole with a RoleBinding grants its namespaced
#                           permissions inside that one namespace and nothing
#                           else, so its cluster-scoped rules never take effect.
#   sensitiveNamespace      Grant lands in a namespace from
#                           sensitive_namespaces.yaml. Not applied to cluster-wide
#                           grants - clusterWide already accounts for that.
#   boundToEveryone         A binding hands the role to system:authenticated or
#                           system:unauthenticated, so every user of the cluster
#                           holds it.
#   privilegedSaReachable   The permission can run a workload in a namespace that
#                           hosts an already-critical service account. Creating a
#                           pod lets you name any service account of that
#                           namespace as its identity, so the permission is worth
#                           as much as the best identity standing next to it.
#   resourceNamesRestricted Every matched rule is pinned to named objects, on
#                           verbs that RBAC actually narrows by name. 'create'
#                           and collection requests ('list', 'watch',
#                           'deletecollection') are never narrowed, so mixing
#                           those in earns no discount. Everything else is -
#                           including 'use', 'bind', 'escalate', 'impersonate'
#                           and 'approve', which exist to be pinned by name.
#   unbound                 No RoleBinding or ClusterRoleBinding references the
#                           role. A latent risk, not an active one.
#
# MATCHING
#
# Verb matching is OR-based: a role matches when it holds ANY of the listed verbs
# on the listed resource. A source rule holding "*" satisfies every named verb.
# A pattern listing "*" asks for unrestricted verb access specifically, and only
# a source rule that also says "*" provides it - which is why the named patterns
# below no longer carry a redundant "*".
#
# Pattern rules are AND-ed: a pattern with two rules matches only when both are
# satisfied, possibly by different rules of the role. That is what makes the
# escalation-chain patterns at the end of this file work.
#
# apiGroups must name the group the resource really lives in - "" for the core
# group. Never use "*" as a shorthand for "any group": an unrelated CRD of the
# same name would then match a Kubernetes-native pattern. A pattern asking for
# ["*"] means group-unrestricted access specifically, and only a role that also
# says "*" satisfies it - which is what the two wildcard patterns below want.
# 'apiGroups: [x], resources: ["*"]' stays every resource of group x alone.

profiles:

  # Namespaced resource whose abuse escalates privileges or exposes credentials.
  namespaced-escalation:
    clusterWide: 1
    sensitiveNamespace: 1
    boundToEveryone: 1
    resourceNamesRestricted: -1
    unbound: -1

  # As above, and the permission lets you run a workload under any identity of
  # the namespace it lands in.
  workload-execution:
    clusterWide: 1
    sensitiveNamespace: 1
    boundToEveryone: 1
    privilegedSaReachable: 1
    resourceNamesRestricted: -1
    unbound: -1

  # Cluster-scoped resource: only a ClusterRole behind a ClusterRoleBinding
  # actually grants it.
  cluster-scoped:
    clusterWide: 1
    namespacedBindingOnly: -1
    boundToEveryone: 1
    resourceNamesRestricted: -1
    unbound: -1

  # Already at the ceiling of the scale; only downgrades can apply.
  unconditional:
    boundToEveryone: 1
    unbound: -1

  # Reconnaissance. Every authenticated user already holds most of these through
  # the built-in system:basic-user ClusterRole, so 'clusterWide' would fire on
  # every cluster there is and quietly undo the point of scoring them LOW.
  # Nothing here should ever climb.
  recon:
    unbound: -1

items:

######################### REGION - RBAC / Access governance #########################

# Risk: Defining or modifying cluster-wide RBAC roles
# Impact: Privilege escalation
# Reference: https://kubernetes.io/docs/concepts/security/rbac-good-practices/

- metadata:
    name: risky-clusterroles-write
    priority: CRITICAL
    scope: cluster
    profile: cluster-scoped
    category: privilege-escalation
  rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["create", "update", "patch"]

# Risk: 'bind' and 'escalate' exist to bypass the privilege-escalation guard that
#       normally stops you granting permissions you do not hold yourself
# Impact: Privilege escalation

- metadata:
    name: risky-clusterroles-bind-escalate
    priority: CRITICAL
    scope: cluster
    profile: cluster-scoped
    category: privilege-escalation
  rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind", "escalate"]

- metadata:
    name: risky-clusterroles-destroy
    priority: HIGH
    scope: cluster
    profile: cluster-scoped
    category: availability
  rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["delete", "deletecollection"]

# Risk: Defining or modifying namespaced RBAC roles
# Impact: Privilege escalation

- metadata:
    name: risky-roles-write
    priority: CRITICAL
    profile: namespaced-escalation
    category: privilege-escalation
  rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    verbs: ["create", "update", "patch"]

- metadata:
    name: risky-roles-bind-escalate
    priority: CRITICAL
    profile: namespaced-escalation
    category: privilege-escalation
  rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    verbs: ["bind", "escalate"]

- metadata:
    name: risky-roles-destroy
    priority: MEDIUM
    profile: namespaced-escalation
    category: availability
  rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    verbs: ["delete", "deletecollection"]

# Risk: Granting roles cluster-wide; create/patch can instantly grant high privileges
# Impact: Privilege escalation
# Reference: https://kubernetes.io/docs/reference/access-authn-authz/rbac/

- metadata:
    name: risky-clusterrolebindings-write
    summary: create or modify ClusterRoleBindings
    description: Changing ClusterRoleBindings can grant roles across the entire cluster.
    impact: Kubernetes prevents binding stronger roles unless the caller holds their permissions or has bind; review both permissions together.
    priority: CRITICAL
    scope: cluster
    profile: cluster-scoped
    category: privilege-escalation
  rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["create", "update", "patch"]

- metadata:
    name: risky-clusterrolebindings-destroy
    priority: HIGH
    scope: cluster
    profile: cluster-scoped
    category: availability
  rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["delete", "deletecollection"]

# Risk: Granting roles within a namespace; patching subjects adds privileged accounts
# Impact: Privilege escalation

- metadata:
    name: risky-rolebindings-write
    summary: create or modify RoleBindings
    description: Changing RoleBindings can grant roles inside a namespace.
    impact: Kubernetes prevents binding stronger roles unless the caller holds their permissions or has bind; review both permissions together.
    priority: CRITICAL
    profile: namespaced-escalation
    category: privilege-escalation
  rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create", "update", "patch"]

- metadata:
    name: risky-rolebindings-destroy
    priority: MEDIUM
    profile: namespaced-escalation
    category: availability
  rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["delete", "deletecollection"]

######################### REGION - Identity / Impersonation #########################

# Impersonation is authorized against cluster-scoped pseudo-resources, so a
# namespaced Role granting it grants nothing.
# Reference: https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/

- metadata:
    name: risky-impersonate-users
    priority: CRITICAL
    scope: cluster
    profile: cluster-scoped
    category: privilege-escalation
  rules:
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]

# Risk: Impersonating a privileged group such as system:masters
- metadata:
    name: risky-impersonate-groups
    priority: CRITICAL
    scope: cluster
    profile: cluster-scoped
    category: privilege-escalation
  rules:
  - apiGroups: [""]
    resources: ["groups"]
    verbs: ["impersonate"]

# ServiceAccounts, unlike users and groups, really are namespaced.
- metadata:
    name: risky-impersonate-serviceaccounts
    priority: CRITICAL
    profile: namespaced-escalation
    category: privilege-escalation
  rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["impersonate"]

# The API always spells these as a subresource ("userextras/scopes"), never as a
# bare "userextras", so the pattern has to cover the whole subtree.
- metadata:
    name: risky-impersonate-userextras
    priority: HIGH
    scope: cluster
    profile: cluster-scoped
    category: privilege-escalation
  rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["userextras/*"]
    verbs: ["impersonate"]

######################### REGION - Wildcard access #########################

# Risk: Full unrestricted access across the entire Kubernetes API surface
# Impact: Cluster compromise

- metadata:
    name: risky-wildcard-all
    summary: use unrestricted Kubernetes API permissions
    description: Wildcards in apiGroups, resources and verbs grant unrestricted API access.
    impact: A bound subject can take full control of the granted scope.
    priority: CRITICAL
    profile: unconditional
    category: privilege-escalation
  rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]

# Risk: named verbs, but on every resource of every API group - such a role can
#       already read every Secret in the cluster.
#
# Must stay directly after risky-wildcard-all: both subsume every more specific
# pattern, and the first one to match is the one reported. Without this entry a
# role holding "*" resources matches most of this file at once and its report
# entry becomes unreadable.

- metadata:
    name: risky-wildcard-resources
    priority: CRITICAL
    profile: unconditional
    category: privilege-escalation
  rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete",
            "deletecollection", "impersonate", "escalate", "bind", "*"]

# Risk: every resource of one API group - including every CRD a vendor ships
#       there, present and future
# Impact: Total control of one product's API surface
#
# 'matchesAnyApiGroup' is what makes this work: the two patterns above want a
# role that is itself group-unrestricted, while this one matches whichever
# single group the role happens to name. Without it, 'apiGroups: [vendor.io],
# resources: ["*"]' matched nothing at all - the group is not "*", so the
# wildcard patterns did not apply, and no named pattern knows that vendor.
#
# Deliberately not treated as subsuming: full control of one group is a real
# finding, but it says nothing about any other group, so more specific patterns
# for that same group are still worth reporting alongside it.

- metadata:
    name: risky-single-group-wildcard
    priority: HIGH
    matchesAnyApiGroup: true
    profile: namespaced-escalation
    category: privilege-escalation
  rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete",
            "deletecollection", "impersonate", "escalate", "bind", "use", "*"]

######################### REGION - Credentials #########################

# Risk: Mint tokens for any service account via the TokenRequest API
# Impact: Token minting / Impersonation

- metadata:
    name: risky-serviceaccount-token
    priority: CRITICAL
    profile: namespaced-escalation
    category: credential-access
  rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]

# Risk: Secrets store passwords, tokens and keys
# Reference: https://kubernetes.io/docs/concepts/configuration/secret/

- metadata:
    name: risky-secrets-read
    summary: read Kubernetes Secrets
    description: Reading Secrets exposes the credentials and sensitive data stored in them.
    priority: HIGH
    profile: namespaced-escalation
    category: credential-access
  rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

- metadata:
    name: risky-secrets-write
    priority: HIGH
    profile: namespaced-escalation
    category: credential-access
  rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch"]

- metadata:
    name: risky-secrets-destroy
    priority: MEDIUM
    profile: namespaced-escalation
    category: availability
  rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["delete", "deletecollection"]

# Risk: ServiceAccounts provide pod identities
- metadata:
    name: risky-write-serviceaccounts
    priority: HIGH
    profile: namespaced-escalation
    category: privilege-escalation
  rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "update", "patch"]

# Deleting a service account breaks whatever authenticates as it.
- metadata:
    name: risky-serviceaccounts-destroy
    priority: MEDIUM
    profile: namespaced-escalation
    category: availability
  rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["delete", "deletecollection"]

######################### REGION - Workload execution #########################

# Risk: Pod creation can mount any secret, adopt any service account of the
#       namespace, and request a privileged securityContext
# Reference: https://kubernetes.io/docs/concepts/security/security-checklist/

- metadata:
    name: risky-pods-create
    summary: create Pods
    description: Creating Pods can mount namespace Secrets and use any ServiceAccount in that namespace.
    priority: HIGH
    profile: workload-execution
    category: workload-execution
  rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create"]

# A pod's image is mutable, so patching one is code execution in an identity you
# did not have to create.
- metadata:
    name: risky-pods-update
    priority: HIGH
    profile: workload-execution
    category: workload-execution
  rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["update", "patch"]

- metadata:
    name: risky-pods-destroy
    priority: MEDIUM
    profile: namespaced-escalation
    category: availability
  rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete", "deletecollection"]

# Risk: Direct arbitrary command execution inside running pods
- metadata:
    name: risky-pods-exec
    priority: HIGH
    profile: namespaced-escalation
    category: workload-execution
  rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]

- metadata:
    name: risky-pods-attach
    priority: HIGH
    profile: namespaced-escalation
    category: workload-execution
  rules:
  - apiGroups: [""]
    resources: ["pods/attach"]
    verbs: ["create"]

# Risk: Port-forwarding exposes internal services and bypasses NetworkPolicy
- metadata:
    name: risky-pods-portforward
    priority: HIGH
    profile: namespaced-escalation
    category: network
  rules:
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]

# Risk: Ephemeral containers attach to a running pod without changing its spec
- metadata:
    name: risky-pods-ephemeralcontainers
    priority: HIGH
    profile: namespaced-escalation
    category: workload-execution
  rules:
  - apiGroups: [""]
    resources: ["pods/ephemeralcontainers"]
    verbs: ["update", "patch"]

# Risk: Proxying into a pod reaches it without NetworkPolicy and with less audit
- metadata:
    name: risky-pods-proxy
    priority: HIGH
    profile: namespaced-escalation
    category: network
  rules:
  - apiGroups: [""]
    resources: ["pods/proxy"]
    verbs: ["get", "create", "update", "patch", "delete"]

# Risk: Pod logs routinely contain credentials and tokens
- metadata:
    name: risky-pods-log
    priority: MEDIUM
    profile: namespaced-escalation
    category: data-access
  rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

- metadata:
    name: risky-pods-eviction
    priority: LOW
    profile: namespaced-escalation
    category: availability
  rules:
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]

# Risk: Binding places a pod on a chosen node, past scheduler constraints and
#       node taints - useful for landing on a control-plane node
- metadata:
    name: risky-pods-binding
    priority: MEDIUM
    profile: namespaced-escalation
    category: workload-execution
  rules:
  - apiGroups: [""]
    resources: ["pods/binding"]
    verbs: ["create"]

- metadata:
    name: risky-bindings
    priority: MEDIUM
    profile: namespaced-escalation
    category: workload-execution
  rules:
  - apiGroups: [""]
    resources: ["bindings"]
    verbs: ["create"]

######################### REGION - Workload controllers #########################

# All of these reduce to "can run a pod", one indirection away.

- metadata:
    name: risky-deployments
    priority: MEDIUM
    profile: workload-execution
    category: workload-execution
  rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "update", "patch"]

- metadata:
    name: risky-statefulsets
    priority: MEDIUM
    profile: workload-execution
    category: workload-execution
  rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["create", "update", "patch"]

# A DaemonSet lands a pod on every node, including control-plane nodes.
- metadata:
    name: risky-daemonsets
    priority: HIGH
    profile: workload-execution
    category: workload-execution
  rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["create", "update", "patch"]

- metadata:
    name: risky-replicasets
    priority: MEDIUM
    profile: workload-execution
    category: workload-execution
  rules:
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["create", "update", "patch"]

- metadata:
    name: risky-replicationcontrollers
    priority: MEDIUM
    profile: workload-execution
    category: workload-execution
  rules:
  - apiGroups: [""]
    resources: ["replicationcontrollers"]
    verbs: ["create", "update", "patch"]

- metadata:
    name: risky-jobs
    priority: MEDIUM
    profile: workload-execution
    category: workload-execution
  rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "update", "patch"]

# A CronJob is the same as a Job plus persistence.
- metadata:
    name: risky-cronjobs
    priority: HIGH
    profile: workload-execution
    category: workload-execution
  rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["create", "update", "patch"]

- metadata:
    name: risky-workload-controllers-destroy
    priority: LOW
    profile: namespaced-escalation
    category: availability
  rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["delete", "deletecollection"]

- metadata:
    name: risky-daemonsets-destroy
    priority: MEDIUM
    profile: namespaced-escalation
    category: availability
  rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["delete", "deletecollection"]

# One pattern per resource, because a pattern listing several resources requires
# the role to hold all of them.

- metadata:
    name: risky-statefulsets-destroy
    priority: LOW
    profile: namespaced-escalation
    category: availability
  rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["delete", "deletecollection"]

- metadata:
    name: risky-replicasets-destroy
    priority: LOW
    profile: namespaced-escalation
    category: availability
  rules:
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["delete", "deletecollection"]

- metadata:
    name: risky-replicationcontrollers-destroy
    priority: LOW
    profile: namespaced-escalation
    category: availability
  rules:
  - apiGroups: [""]
    resources: ["replicationcontrollers"]
    verbs: ["delete", "deletecollection"]

- metadata:
    name: risky-jobs-destroy
    priority: LOW
    profile: namespaced-escalation
    category: availability
  rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["delete", "deletecollection"]

- metadata:
    name: risky-cronjobs-destroy
    priority: MEDIUM
    profile: namespaced-escalation
    category: availability
  rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["delete", "deletecollection"]

######################### REGION - Admission / Policy enforcement #########################

# Risk: Webhook configurations decide what admission control sees and allows
# Reference: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/

- metadata:
    name: risky-validatingwebhookconfigurations
    priority: CRITICAL
    scope: cluster
    profile: cluster-scoped
    category: policy-bypass
  rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["create", "update", "patch", "delete"]

# Risk: A mutating webhook silently rewrites any object on its way in
- metadata:
    name: risky-mutatingwebhookconfigurations
    priority: CRITICAL
    scope: cluster
    profile: cluster-scoped
    category: policy-bypass
  rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["create", "update", "patch", "delete"]

# The in-tree CEL policy engine, same enforcement role as a webhook.

- metadata:
    name: risky-validatingadmissionpolicies
    priority: HIGH
    scope: cluster
    profile: cluster-scoped
    category: policy-bypass
  rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies"]
    verbs: ["create", "update", "patch", "delete"]

- metadata:
    name: risky-validatingadmissionpolicybindings
    priority: HIGH
    scope: cluster
    profile: cluster-scoped
    category: policy-bypass
  rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicybindings"]
    verbs: ["create", "update", "patch", "delete"]

- metadata:
    name: risky-mutatingadmissionpolicies
    priority: HIGH
    scope: cluster
    profile: cluster-scoped
    category: policy-bypass
  rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingadmissionpolicies"]
    verbs: ["create", "update", "patch", "delete"]

- metadata:
    name: risky-mutatingadmissionpolicybindings
    priority: HIGH
    scope: cluster
    profile: cluster-scoped
    category: policy-bypass
  rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingadmissionpolicybindings"]
    verbs: ["create", "update", "patch", "delete"]

# Removed in Kubernetes 1.25, still present on older clusters. 'use' on a
# permissive PSP is what let a workload run privileged.
- metadata:
    name: risky-podsecuritypolicies-use
    priority: HIGH
    scope: cluster
    profile: cluster-scoped
    category: policy-bypass
  rules:
  - apiGroups: ["policy"]
    resources: ["podsecuritypolicies"]
    verbs: ["use"]

# Risk: Namespace labels drive Pod Security Admission; relabelling switches it off
# Reference: https://kubernetes.io/docs/tasks/configure-pod-container/enforce-standards-namespace-labels/
- metadata:
    name: risky-namespaces
    priority: HIGH
    scope: cluster
    profile: cluster-scoped
    category: policy-bypass
  rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "update", "patch", "delete"]

######################### REGION - Identity / Certificates #########################

# Risk: Approving a CSR issues a client certificate for any identity it names
# Reference: https://kubernetes.io/docs/reference/access-authn-authz/certificate-signing-requests/

- metadata:
    name: risky-csr-approval
    priority: CRITICAL
    scope: cluster
    profile: cluster-scoped
    category: credential-access
  rules:
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests/approval"]
    verbs: ["approve", "update"]

