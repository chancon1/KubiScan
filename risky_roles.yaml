  metadata:
    namespace: default
    name: risky-cluster-wide-read-endpoints
    priority: HIGH
  rules:
  - apiGroups: ["*"]
    resources: ["namespaces"]
    verbs: ["list"]
  - apiGroups: ["*"]
    resources: ["endpoints"]
    verbs: ["get", "list"]

# Risk: Cluster-wide endpoint slice visibility reveals pod-level service topology
#   GroupA:
#       Verb: list
#       Resource: namespaces
#   GroupB:
#       Verb: get, list
#       Resource: endpointslices

- kind: Role
  metadata:
    namespace: default
