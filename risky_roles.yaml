######################### REGION - Cluster-wide read on sensitive resources (CRITICAL) #########################

# Risk: Cluster-wide visibility of network segmentation and traffic policy model
#   GroupA:
#       Verb: list
#       Resource: namespaces
#   GroupB:
#       Verb: get, list
#       Resource: networkpolicies

- kind: Role
  metadata:
    namespace: default
    name: risky-cluster-wide-read-networkpolicies
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["namespaces"]
    verbs: ["list"]
  - apiGroups: ["*"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]

# Risk: Cluster-wide access to pod logs can expose credentials, tokens and internal data
#   GroupA:
#       Verb: list
#       Resource: namespaces
#   GroupB:
#       Verb: get, list
#       Resource: pods/log

- kind: Role
  metadata:
    namespace: default
    name: risky-cluster-wide-read-pod-logs
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["namespaces"]
    verbs: ["list"]
  - apiGroups: ["*"]
    resources: ["pods/log"]
    verbs: ["get", "list"]

# Risk: Cluster-wide read access to external secret mappings can disclose secret architecture and flows
#   GroupA:
#       Verb: list
#       Resource: namespaces
#   GroupB:
#       Verb: get, list
#       Resource: externalsecrets

- kind: Role
  metadata:
    namespace: default
    name: risky-cluster-wide-read-externalsecrets
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["namespaces"]
    verbs: ["list"]
  - apiGroups: ["*"]
    resources: ["externalsecrets"]
    verbs: ["get", "list"]

# Risk: Cluster-wide read access to namespace secret stores may reveal external secret backend details
#   GroupA:
#       Verb: list
#       Resource: namespaces
#   GroupB:
#       Verb: get, list
#       Resource: secretstores

- kind: Role
  metadata:
    namespace: default
    name: risky-cluster-wide-read-secretstores
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["namespaces"]
    verbs: ["list"]
  - apiGroups: ["*"]
    resources: ["secretstores"]
    verbs: ["get", "list"]

# Risk: Cluster-wide read access to cluster-wide secret store definitions and backend references
#   GroupA:
#       Verb: list
#       Resource: namespaces
#   GroupB:
#       Verb: get, list
#       Resource: clustersecretstores

- kind: Role
  metadata:
    namespace: default
    name: risky-cluster-wide-read-clustersecretstores
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["namespaces"]
    verbs: ["list"]
  - apiGroups: ["*"]
    resources: ["clustersecretstores"]
    verbs: ["get", "list"]

# Risk: Cluster-wide read access to secret push definitions may expose secret destination topology
#   GroupA:
#       Verb: list
#       Resource: namespaces
#   GroupB:
#       Verb: get, list
#       Resource: pushsecrets

- kind: Role
  metadata:
    namespace: default
    name: risky-cluster-wide-read-pushsecrets
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["namespaces"]
    verbs: ["list"]
  - apiGroups: ["*"]
    resources: ["pushsecrets"]
    verbs: ["get", "list"]

######################### END REGION - Cluster-wide read on sensitive resources #########################

######################### REGION - Webhook Configuration Mutations (CRITICAL) #########################

# Risk: Mutating webhooks can silently modify any object passing through the API server
# Reference: K8s RBAC Good Practices, K8s Admission Webhook Good Practices

- kind: Role
  metadata:
    namespace: default
    name: risky-create-mutatingwebhookconfigurations
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["create"]

- kind: Role
  metadata:
    namespace: default
    name: risky-update-mutatingwebhookconfigurations
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["update"]

- kind: Role
  metadata:
    namespace: default
    name: risky-patch-mutatingwebhookconfigurations
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["patch"]

# Risk: Validating webhooks can block operations or exfiltrate data
# Reference: K8s RBAC Good Practices, K8s Admission Webhook Good Practices

- kind: Role
  metadata:
    namespace: default
    name: risky-create-validatingwebhookconfigurations
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["create"]

- kind: Role
  metadata:
    namespace: default
    name: risky-update-validatingwebhookconfigurations
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["update"]

- kind: Role
  metadata:
    namespace: default
    name: risky-patch-validatingwebhookconfigurations
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["patch"]

######################### END REGION - Webhook Configuration Mutations #########################

######################### END REGION - CRITICAL Roles #########################

######################### REGION - HIGH Roles #########################

# Risk: Viewing specific secrets (requires knowing name, less dangerous than list)
# Verb: get
# Resources: secrets
# Reference: CyberArk, SCHUTZWERK
# Example: kubectl get secrets <secret_name>

- kind: Role
  metadata:
    namespace: default
    name: risky-get-secrets
    priority: HIGH
  rules:
  - apiGroups: ["*"]
    resources: ["secrets"]
    verbs: ["get"]

# Risk: Reading all resources including secrets
# Verb: get
# Resources: * (wildcard includes secrets and future resource types)
# Reference: K8s RBAC Good Practices - wildcards include future resource types

- kind: Role
  metadata:
    namespace: default
    name: risky-any-resource-get
    priority: HIGH
  rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get"]

######################### REGION - Cluster-wide read on selective resources (HIGH) #########################

