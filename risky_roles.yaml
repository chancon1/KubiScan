    name: risky-cal-globalnetworkpolicies
    priority: HIGH
    scope: cluster
    profile: cluster-scoped
    category: network
  rules:
  - apiGroups: ["projectcalico.org"]
    resources: ["globalnetworkpolicies"]
    verbs: ["create", "update", "patch", "delete"]

- metadata:
    name: risky-cal-networkpolicies
    priority: HIGH
    profile: namespaced-escalation
    category: network
  rules:
  - apiGroups: ["projectcalico.org"]
    resources: ["networkpolicies"]
    verbs: ["create", "update", "patch", "delete"]

# Risk: Tiers define evaluation order, so reordering them defeats guardrails
#       without editing a single policy
- metadata:
    name: risky-cal-tiers
    priority: HIGH
    scope: cluster
    profile: cluster-scoped
    category: network
  rules:
  - apiGroups: ["projectcalico.org"]
    resources: ["tiers"]
    verbs: ["create", "update", "patch", "delete"]

- metadata:
    name: risky-cal-networksets
    priority: MEDIUM
    profile: namespaced-escalation
    category: network
  rules:
  - apiGroups: ["projectcalico.org"]
    resources: ["networksets"]
    verbs: ["create", "update", "patch", "delete"]

- metadata:
    name: risky-cal-globalnetworksets
    priority: HIGH
    scope: cluster
    profile: cluster-scoped
    category: network
  rules:
  - apiGroups: ["projectcalico.org"]
    resources: ["globalnetworksets"]
    verbs: ["create", "update", "patch", "delete"]

- metadata:
