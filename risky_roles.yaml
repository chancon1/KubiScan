
######################### REGION - Risky permissions combinations #########################

# Source: rbac_security_matrix_k8s_kyverno_updated.xlsx
# Generated from security matrix covering: Kubernetes, Kyverno, Policy WG, Cilium, Calico
#
# The order is important!
# Patterns are ordered by priority (CRITICAL first, then HIGH, MEDIUM, LOW).
# When a fully-wildcard pattern matches (verbs/resources/apiGroups all "*"),
# the scanner stops checking further patterns, as wildcard semantically
# subsumes all more specific rules.
#
# Verb matching is AND-based: a role matches a pattern only if it contains ALL listed verbs
# on the listed resource. Single-verb entries detect specific dangerous permissions.
# The wildcard entry ("*") catches roles with unrestricted verb access.

######################### REGION - CRITICAL #########################

items:

# ---- Kubernetes: RBAC / Access governance ----

# Risk: Defining or modifying cluster-wide RBAC roles; bind/escalate bypass built-in protections
# API Group: rbac.authorization.k8s.io | Resource: clusterroles | Scope: Cluster
# Impact: Privilege escalation
# Reference: https://kubernetes.io/docs/concepts/security/rbac-good-practices/

- kind: Role
  metadata:
    namespace: default
    name: risky-clusterroles
    priority: CRITICAL
  rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["create", "update", "patch", "delete", "bind", "escalate", "*"]

# Risk: Defining or modifying namespaced RBAC roles; bind/escalate enable privilege escalation
# API Group: rbac.authorization.k8s.io | Resource: roles | Scope: Namespaced
# Impact: Privilege escalation
# Reference: https://kubernetes.io/docs/concepts/security/rbac-good-practices/

- kind: Role
  metadata:
    namespace: default
    name: risky-roles
    priority: CRITICAL
  rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    verbs: ["create", "update", "patch", "delete", "bind", "escalate", "*"]

# Risk: Granting roles cluster-wide; create/patch can instantly grant high privileges
# API Group: rbac.authorization.k8s.io | Resource: clusterrolebindings | Scope: Cluster
# Impact: Privilege escalation / Broad access
# Reference: https://kubernetes.io/docs/reference/access-authn-authz/rbac/

- kind: Role
  metadata:
    namespace: default
    name: risky-clusterrolebindings
    priority: CRITICAL
  rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["create", "update", "patch", "delete", "*"]

# Risk: Granting roles within namespaces; patching subjects can add privileged accounts
# API Group: rbac.authorization.k8s.io | Resource: rolebindings | Scope: Namespaced
# Impact: Privilege escalation
# Reference: https://kubernetes.io/docs/reference/access-authn-authz/rbac/

- kind: Role
  metadata:
    namespace: default
    name: risky-rolebindings
    priority: CRITICAL
  rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create", "update", "patch", "delete", "*"]

# ---- Kubernetes: Identity / Impersonation ----

# Risk: Impersonate any user identity, gaining that identity's permissions
# Resource: users | Scope: N/A
# Impact: Privilege escalation
# Reference: https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/

- kind: Role
  metadata:
    namespace: default
    name: risky-impersonate-users
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["users"]
    verbs: ["impersonate"]

# Risk: Impersonate privileged groups (e.g., system:masters), gaining aggregated permissions
# Resource: groups | Scope: N/A
# Impact: Privilege escalation
# Reference: https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/

- kind: Role
  metadata:
    namespace: default
    name: risky-impersonate-groups
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["groups"]
    verbs: ["impersonate"]

# Risk: Impersonate service accounts, enabling workload identity takeover
# Resource: serviceaccounts | Scope: Namespaced
# Impact: Privilege escalation
# Reference: https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/

- kind: Role
  metadata:
    namespace: default
    name: risky-impersonate-serviceaccounts
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["serviceaccounts"]
    verbs: ["impersonate"]

# ---- Kubernetes: RBAC / Wildcard access ----

# Risk: Full unrestricted access across the entire Kubernetes API surface
# API Group: * | Resource: * | Scope: Cluster/Namespaced
# Impact: Full administrative control / Cluster compromise
# Reference: API groups/resources/verbs wildcard

- kind: Role
  metadata:
    namespace: default
    name: risky-wildcard-all
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]

# ---- Kubernetes: Identity / ServiceAccount tokens ----

# Risk: Mint tokens for any service account via TokenRequest API (long-lived, traceless)
# Resource: serviceaccounts/token | Scope: Namespaced
# Impact: Token minting / Impersonation risk

- kind: Role
  metadata:
    namespace: default
    name: risky-serviceaccount-token
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]

# ---- Kubernetes: Secrets / Credentials ----

# Risk: Secrets store passwords, tokens, keys; reads exfiltrate, writes replace credentials
# Resource: secrets | Scope: Namespaced
# Impact: Secret exposure / Credential theft
# Reference: https://kubernetes.io/docs/concepts/configuration/secret/

- kind: Role
  metadata:
    namespace: default
    name: risky-secrets
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "*"]

# ---- Kubernetes: Workload execution ----

# Risk: Pod creation/modification can mount secrets, set any SA, use privileged securityContext
# Resource: pods | Scope: Namespaced
# Impact: Privilege escalation / Code execution
# Reference: https://kubernetes.io/docs/concepts/security/security-checklist/

- kind: Role
  metadata:
    namespace: default
    name: risky-pods
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["pods"]
    verbs: ["create", "update", "patch", "delete", "*"]

# Risk: Direct arbitrary command execution inside running pods
# Resource: pods/exec | Scope: Namespaced
# Impact: Interactive access / Data exfiltration
# Reference: https://kubernetes.io/docs/reference/using-api/api-concepts/

- kind: Role
  metadata:
    namespace: default
    name: risky-pods-exec
    priority: CRITICAL
  rules:
  - apiGroups: ["*"]
    resources: ["pods/exec"]
    verbs: ["create"]

# ---- Kubernetes: Admission / Policy enforcement ----

# Risk: Validating webhooks can block operations or exfiltrate data; tampering bypasses policy enforcement
# API Group: admissionregistration.k8s.io | Resource: validatingwebhookconfigurations | Scope: Cluster
# Impact: Policy bypass / Control-plane integrity
# Reference: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/

- kind: Role
  metadata:
    namespace: default
    name: risky-validatingwebhookconfigurations
    priority: CRITICAL
  rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["create", "update", "patch", "delete", "*"]

# Risk: Mutating webhooks can silently modify any object; tampering enables hidden privilege changes
# API Group: admissionregistration.k8s.io | Resource: mutatingwebhookconfigurations | Scope: Cluster
# Impact: Policy bypass / Control-plane integrity
# Reference: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/

- kind: Role
  metadata:
    namespace: default
    name: risky-mutatingwebhookconfigurations
    priority: CRITICAL
  rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["create", "update", "patch", "delete", "*"]

# ---- Kubernetes: Identity / Certificates ----

# Risk: Approving CSRs can issue client certificates for any identity
# API Group: certificates.k8s.io | Resource: certificatesigningrequests/approval | Scope: Cluster
# Impact: Credential issuance
# Reference: https://kubernetes.io/docs/reference/access-authn-authz/certificate-signing-requests/

- kind: Role
  metadata:
    namespace: default
    name: risky-csr-approval
    priority: CRITICAL
  rules:
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests/approval"]
    verbs: ["approve", "update"]

# ---- Kyverno: kyverno.io CRDs ----

# Risk: Cluster-wide policies validate/mutate/generate/verifyImages; changing them alters enforcement
# API Group: kyverno.io | Resource: clusterpolicies | Scope: Cluster
# Impact: Policy bypass / Mutation / Generation
# Reference: https://kyverno.io/docs/introduction/how-kyverno-works/

- kind: Role
  metadata:
    namespace: default
    name: risky-kyv-clusterpolicies
    priority: CRITICAL
  rules:
  - apiGroups: ["kyverno.io"]
    resources: ["clusterpolicies"]
    verbs: ["create", "update", "patch", "delete", "*"]

# Risk: PolicyException allows bypassing specific policy/rule combinations
# API Group: kyverno.io | Resource: policyexceptions | Scope: Namespaced
# Impact: Policy bypass
# Reference: https://kyverno.io/docs/guides/exceptions/

- kind: Role
  metadata:
    namespace: default
    name: risky-kyv-policyexceptions
    priority: CRITICAL
  rules:
  - apiGroups: ["kyverno.io"]
    resources: ["policyexceptions"]
    verbs: ["create", "update", "patch", "delete", "*"]

# ---- Kyverno: policies.kyverno.io CRDs ----

# Risk: ValidatingPolicy validates K8s resources/JSON; tampering bypasses admission enforcement
# API Group: policies.kyverno.io | Resource: validatingpolicies | Scope: Cluster
# Impact: Admission enforcement bypass
# Reference: https://kyverno.io/docs/policy-types/overview/

- kind: Role
  metadata:
    namespace: default
    name: risky-kyv-validatingpolicies
    priority: CRITICAL
  rules:
  - apiGroups: ["policies.kyverno.io"]
    resources: ["validatingpolicies"]
    verbs: ["create", "update", "patch", "delete", "*"]

# Risk: MutatingPolicy can mutate new or existing resources; tampering enables stealth changes
# API Group: policies.kyverno.io | Resource: mutatingpolicies | Scope: Cluster
# Impact: Stealth mutation / Privilege escalation
# Reference: https://kyverno.io/docs/policy-types/overview/

- kind: Role
  metadata:
    namespace: default
    name: risky-kyv-mutatingpolicies
    priority: CRITICAL
  rules:
  - apiGroups: ["policies.kyverno.io"]
    resources: ["mutatingpolicies"]
    verbs: ["create", "update", "patch", "delete", "*"]

# Risk: CEL PolicyException enables bypass of CEL-based policies
# API Group: policies.kyverno.io | Resource: policyexceptions | Scope: Namespaced
# Impact: Policy bypass
# Reference: https://kyverno.io/docs/policy-types/overview/

- kind: Role
  metadata:
    namespace: default
    name: risky-kyv-cel-policyexceptions
    priority: CRITICAL
  rules:
  - apiGroups: ["policies.kyverno.io"]
    resources: ["policyexceptions"]
    verbs: ["create", "update", "patch", "delete", "*"]

# ---- Cilium: Network policy ----

# Risk: CiliumNetworkPolicy extends K8s NetworkPolicy; changes can open ingress/egress, weaken isolation
# API Group: cilium.io | Resource: ciliumnetworkpolicies | Scope: Namespaced
# Impact: Segmentation bypass / Lateral movement
# Reference: https://docs.cilium.io/en/stable/network/kubernetes/policy.html

- kind: Role
  metadata:
    namespace: default
    name: risky-cil-networkpolicies
    priority: CRITICAL
  rules:
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["create", "update", "patch", "delete", "*"]

# Risk: CiliumClusterwideNetworkPolicy applies cluster-wide; tampering weakens global segmentation
# API Group: cilium.io | Resource: ciliumclusterwidenetworkpolicies | Scope: Cluster
# Impact: Cluster-wide segmentation bypass / Node traffic exposure
# Reference: https://docs.cilium.io/en/stable/security/policy/index.html

- kind: Role
  metadata:
    namespace: default
    name: risky-cil-clusterwidepolicies
    priority: CRITICAL
  rules:
  - apiGroups: ["cilium.io"]
    resources: ["ciliumclusterwidenetworkpolicies"]
    verbs: ["create", "update", "patch", "delete", "*"]

# ---- Calico: Network policy ----

# Risk: GlobalNetworkPolicy applies to pods, VMs, and host endpoints; changes broadly alter isolation
# API Group: projectcalico.org | Resource: globalnetworkpolicies | Scope: Cluster
# Impact: Global segmentation bypass / Host and workload exposure
# Reference: https://docs.tigera.io/calico/latest/reference/resources/globalnetworkpolicy

- kind: Role
  metadata:
    namespace: default
    name: risky-cal-globalnetworkpolicies
    priority: CRITICAL
  rules:
  - apiGroups: ["projectcalico.org"]
    resources: ["globalnetworkpolicies"]
    verbs: ["create", "update", "patch", "delete", "*"]

# Risk: Tiers define policy ordering/precedence; changing tiers can reorder evaluation and weaken guardrails
# API Group: projectcalico.org | Resource: tiers | Scope: Cluster
# Impact: Policy ordering bypass / Delegation control
# Reference: https://docs.tigera.io/calico/latest/reference/resources/tier

- kind: Role
  metadata:
    namespace: default
    name: risky-cal-tiers
    priority: CRITICAL
  rules:
  - apiGroups: ["projectcalico.org"]
    resources: ["tiers"]
    verbs: ["create", "update", "patch", "delete", "*"]

######################### END REGION - CRITICAL #########################

