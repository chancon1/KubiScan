######################### REGION - Argo CD #########################

# Risk: Argo CD deploys with its own, usually cluster-wide, privileges. Writing
#       an Application makes it deploy whatever you point it at, wherever its
#       AppProject allows - a classic delegated-escalation path.

- metadata:
    name: risky-argo-applications
    priority: HIGH
    profile: namespaced-escalation
    category: privilege-escalation
  rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["create", "update", "patch", "delete"]

- metadata:
    name: risky-argo-applicationsets
    priority: HIGH
    profile: namespaced-escalation
    category: privilege-escalation
  rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    verbs: ["create", "update", "patch", "delete"]

# AppProject is the guardrail that says where Applications may deploy.
- metadata:
    name: risky-argo-appprojects
    priority: HIGH
    profile: namespaced-escalation
    category: policy-bypass
  rules:
  - apiGroups: ["argoproj.io"]
    resources: ["appprojects"]
    verbs: ["create", "update", "patch", "delete"]

######################### REGION - Escalation chains #########################
#
# Multi-rule patterns: every rule must be satisfied, possibly by different rules
# of the same role. These describe combinations that are worth more than the sum
# of their parts, and they are what the single-permission patterns above cannot
# express.

# Create the identity, then grant it whatever you like. Neither half needs any
# pre-existing privileged account to be useful.
- metadata:
    name: risky-chain-selfservice-identity
    priority: CRITICAL
    profile: namespaced-escalation
    category: privilege-escalation
  rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create"]

# Run a workload, then read the credentials it was allowed to mount.
- metadata:
    name: risky-chain-pod-and-secrets
    priority: CRITICAL
    profile: namespaced-escalation
    category: credential-access
  rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

# Mint a token for an existing account, having first found out which accounts
# exist and what they are worth.
- metadata:
    name: risky-chain-token-minting
    priority: CRITICAL
    profile: namespaced-escalation
    category: credential-access
  rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list"]

######################### END REGION - Risky permissions combinations #########################
