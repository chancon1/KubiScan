# Namespaces where an otherwise ordinary permission becomes a cluster-level
# problem. A finding whose pattern declares the 'sensitiveNamespace' modifier is
# raised by one level when it lands in one of these.
#
# What belongs here: namespaces holding control-plane components, cluster-wide
# credentials, policy enforcement, or observability. "Can create a pod in
# monitoring" is not the same risk as "can create a pod in team-sandbox",
# because the first one sits next to Grafana admin credentials and a Splunk HEC
# token while the second sits next to nothing.
#
# An entry ending in '*' matches by prefix, so a distribution that names its
# platform namespaces from one stem needs one line rather than a list that goes
# stale as soon as the platform grows a component. Everything else is an exact
# name on purpose: 'infra' must not quietly cover 'infra-sandbox'.
#
# The groups are purely documentation - the scanner flattens them into one set.
# Override the whole list from the command line with --sensitive-namespaces,
# or add to it with --sensitive-namespaces-add.

groups:

  # Namespaces the Kubernetes control plane owns itself.
  kubernetes:
    - kube-system
    - kube-public
    - kube-node-lease

  # Shturval places its platform components under one prefix. Matched by prefix
  # so that a component added later is covered without editing this file.
  #
  # Confirmed against a live cluster: shturval-cd, shturval-cert-expiration,
  # shturval-node-config-system, shturval-rollouts, shturval-services-system,
  # shturval-trust-manager and shturval-update-system are all platform
  # components, and no application namespace shares the stem.
  #
  # The prefix appears on ClusterRole and ServiceAccount names too, and a role
  # called 'shturval-cert-manager-cainjector' can perfectly well live in a
  # namespace called plain 'cert-manager'. What belongs here is the namespace
  # name - the components that live outside the prefix are listed below.
  shturval:
    - 'shturval-*'

  # Rancher / RKE distributions place control-plane add-ons of their own here.
  rancher:
    - cattle-system
    - cattle-prometheus
    - cattle-monitoring-system
    - fleet-system

  # Policy enforcement, admission and runtime security. A subject able to write
  # here can switch off the control that is supposed to catch everything else -
  # including this scanner, whose own service account reads the whole cluster.
  policy_and_runtime_security:
    - kyverno
    - gatekeeper-system
    - opa
    - tetragon
    - node-problem-detector
    - trivy-system
    - kubiscan

  # Secret and certificate delivery. Each of these mints or syncs credentials
  # for every other namespace, so a grant here is a grant everywhere.
  secrets_and_certificates:
    - cert-manager
    - external-secrets

  # Ingress and service mesh. These terminate TLS for the cluster's traffic and
  # hold the certificates and keys that go with it; kube-vip additionally owns
  # the control-plane VIP.
  networking_and_ingress:
    - ingress
    - ingress-nginx
    - istio-system
    - higress-system
    - kube-vip

  # Storage, snapshots and backup. Backup tooling reads every Secret and
  # ConfigMap in the cluster by design and writes them to object storage, so its
  # namespace is worth as much as the cluster it protects.
  storage_and_backup:
    - longhorn-system
    - csi-s3
    - nfs-sc
    - goofys
    - rawfile-provisioner
    - snapshotter
    - velero

  # Observability. Metrics, logs and traces from every workload land here,
  # together with the credentials for whatever they are shipped to.
  observability:
    - monitoring
    - logging
    - splunk
    - cadvisor
    - coroot
    - coroot-clickhouse
    - victoria-metrics
    - monq
    - goldilocks

  # GitOps, delivery and image distribution. A subject able to write here
  # deploys into every namespace the pipeline can reach, or replaces the images
  # the cluster pulls.
  delivery_and_images:
    - argocd
    - argo-events
    - image-tracker
    - dragonfly-system

  # Remaining platform infrastructure, including the web console: a grant in the
  # dashboard's namespace reaches the token it authenticates with.
  infrastructure:
    - infra
    - kubernetes-dashboard
